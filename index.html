<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assistant — Portrait interactif de l’Eau</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#23343d;background:#eef1f3}*{box-sizing:border-box}body{margin:0;padding:0}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:100%;max-width:470px;height:100dvh;min-height:390px;max-height:850px;margin:auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 8px 28px #1d343c22}.head{background:#213943;color:white;display:flex;gap:12px;align-items:center;padding:14px 16px;flex-shrink:0}.drop{background:#f0e222;color:#23343d;padding:9px;border-radius:10px;font-size:20px}.head strong{font-size:14px;display:block}.head small{font-size:11px;color:#cfe1e4}.head .reset{margin-left:auto;background:none;color:#e7eeee;border:1px solid #6c848b;padding:6px 9px;border-radius:7px;font-size:12px}.messages{flex:1;overflow-y:auto;padding:18px 15px;background:#f4f7f8;display:flex;flex-direction:column;gap:12px}.msg{max-width:93%;padding:12px 13px;border-radius:13px;font-size:13px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:white;border:1px solid #dce5e9;border-top-left-radius:3px}.user{align-self:flex-end;background:#f0e222;color:#1e2c34;border-top-right-radius:3px}.msg a{color:#145e87}.label{font-size:11px;color:#61727b}.quick{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #e8ecee;max-height:108px;overflow:auto}.quick button{border:1px solid #cddce2;border-radius:17px;background:white;color:#244050;padding:7px 10px;font-size:11px}.quick button:hover{background:#f5f0c5}.entry{display:flex;gap:7px;padding:10px;border-top:1px solid #e4eaed}.entry textarea{flex:1;resize:none;min-height:43px;max-height:100px;padding:10px;border:1px solid #ccd7da;border-radius:9px;font-size:13px}.entry button{border:0;background:#f0e222;border-radius:9px;padding:0 13px;font-weight:bold;color:#1b262b}.foot{font-size:10px;color:#66777f;padding:0 13px 10px}.busy{opacity:.7}a{color:#0b5f89}@media(min-width:600px){body{padding:8px}.shell{border-radius:13px;overflow:hidden;height:calc(100dvh - 16px)}}
</style></head><body><main class="shell" aria-label="Assistant du Portrait de l'Eau"><header class="head"><span class="drop" aria-hidden="true">💧</span><div><strong>Assistant du Portrait de l’Eau</strong><small>Navigation, données et analyses territoriales</small></div><button class="reset" id="reset" type="button">Effacer</button></header><section id="messages" class="messages" aria-live="polite"></section><nav class="quick" aria-label="Questions proposées"><button data-question="Où trouver les couches et la légende ?">Couches & légende</button><button data-question="Comment sélectionner un SAGE, une intercommunalité ou un bassin versant ?">Filtres</button><button data-question="Où voir les stations d’épuration ?">Stations d’épuration</button><button data-question="Comment faire une analyse complète d'un territoire ?">Analyse complète</button><button data-question="Comment contacter l'Agence ?">Contacter l’Agence</button></nav><form id="form" class="entry"><textarea id="question" rows="2" maxlength="2000" placeholder="Posez votre question sur le portrait…" aria-label="Votre question" required></textarea><button id="send" type="submit">Envoyer</button></form><div class="foot">Les analyses chiffrées exigent des données officielles et des sources vérifiables.</div></main><script>
/* PARAMETRES : renseigner API_URL quand un serveur IA est déployé. */
const SETTINGS={API_URL:"", CONTACT_URL:"https://www.aud-stomer.fr/contact/", CONTACT_EMAIL:"", PORTRAIT_URL:""};
const messages=document.getElementById('messages'),field=document.getElementById('question'),send=document.getElementById('send');
let history=[];
function say(text,who='bot'){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;history.push({role:who==='user'?'user':'assistant',content:text});if(history.length>16)history=history.slice(-16);return el}
function norm(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,' ').replace(/\s+/g,' ')}
function match(t,terms){return terms.some(x=>t.includes(x))}
function localAnswer(q){const t=norm(q);
if(match(t,['couche','legende','afficher une donnee','activer','superposer','layer']))return "Pour trouver les couches de la carte :\n1. Ouvrez la thématique souhaitée dans le menu supérieur.\n2. Dans la zone cartographique, cherchez l’icône représentant des couches empilées, située sur la droite de la carte.\n3. Ouvrez la liste et activez la couche voulue si un contrôle d’affichage est disponible.\n4. Consultez le panneau « Enjeux » / « Périmètres & Habillage » à droite : il présente les éléments et légendes visibles.\n5. Zoomez et cliquez sur les entités de la carte si elles offrent une fiche d’information.\nSelon la page, les outils peuvent être différents. Dites-moi le nom de la couche recherchée.";
if(match(t,['sage','intercommunal','epci','bassin versant','filtre','territoire','selectionner']))return "Pour filtrer le territoire :\n1. Ouvrez la page cartographique concernée.\n2. Dans la barre latérale gauche, utilisez « Filtrer par SAGE », « Filtrer par intercommunalités » ou « Filtre par bassin versant ».\n3. Utilisez la recherche ou sélectionnez le territoire dans la liste.\n4. Attendez la mise à jour de la carte et des indicateurs.\n5. Pour revenir à l’ensemble, retirez la sélection si l’interface le permet.\nQuel SAGE, EPCI ou bassin versant souhaitez-vous étudier ?";
if(match(t,['station d epuration','step','assainissement','traitement des eaux']))return "Sur la carte que vous m’avez montrée, le panneau de droite comporte la rubrique « Enjeux » puis « Station d’épuration ». Ouvrez la page cartographique, vérifiez que cette couche est active, puis cliquez sur un symbole de station pour consulter ses attributs si une fenêtre d’information est disponible. Pour connaître le nombre de stations d’un territoire ou leur capacité, il faut interroger la couche de données correspondante.";
if(match(t,['cours d eau','reseau hydrographique','riviere','hydrograph']))return "Sur la carte, le panneau de droite affiche « Périmètres & Habillage », puis « Réseau hydrographique / Cours d’eau ». Utilisez aussi l’outil de couches empilées pour vérifier les couches actives. La carte seule ne permet pas de calculer une longueur totale fiable : il faut la géométrie SIG et un système de coordonnées adapté.";
if(match(t,['analyse','diagnostic','rapport','bilan','comparaison','compare','statistique','evolution','combien','nombre','surface','superficie','pourcentage']))return "Je peux vous aider à préparer une analyse territoriale structurée : contexte, périmètre, inventaire des couches, indicateurs, interprétation, limites et recommandations.\nPour une ANALYSE CHIFFRÉE VÉRIFIÉE, indiquez :\n• le territoire (SAGE, EPCI, commune ou bassin versant) ;\n• le sujet (inondation, cours d’eau, stations d’épuration, zones humides…) ;\n• la période et les indicateurs souhaités.\nLa version actuelle ne lit pas encore les couches ArcGIS en direct. Une connexion aux services ArcGIS et à une IA est nécessaire pour calculer et commenter des résultats réels, plutôt que d’inventer des chiffres.";
if(match(t,['inondation','risque','aleas','crue','submersion']))return "Pour les risques liés à l’eau, ouvrez l’onglet « Risques liés à l’eau » en haut du portail. Sélectionnez ensuite un SAGE, un EPCI ou un bassin versant à gauche et consultez les couches/indicateurs proposés par la page. Précisez si vous cherchez une zone inondable, un aléa, un enjeu exposé ou une comparaison territoriale : ce ne sont pas les mêmes données.";
if(match(t,['biodiversite','zone humide','milieux aquatiques','habitat naturel']))return "Ouvrez « Biodiversité & milieux humides/aquatiques » dans le menu du haut. Consultez les couches et la légende, puis appliquez un filtre territorial si disponible. Pour une surface, un pourcentage ou une comparaison, il faudra les données géographiques sous-jacentes.";
if(match(t,['petit cycle','usage de l eau','patrimoine de l eau']))return "Le menu du portail contient « Petit cycle de l’eau », « Usages de l’Eau » et « Patrimoine lié à l’eau ». Sur la version d’accueil que vous m’avez transmise, ces rubriques sont annoncées en cours de construction. Je ne peux donc pas affirmer quelles données y sont déjà disponibles. Choisissez la rubrique concernée et décrivez ce que vous voyez.";
if(match(t,['contact','technicien','probleme','bug','difficulte','aide humaine']))return "Pour contacter l’Agence, utilisez le bouton « Contactez-nous » situé en haut à droite du portail. Décrivez votre question, la page concernée, le filtre choisi et, si possible, joignez une capture d’écran. Vous pouvez aussi consulter : "+SETTINGS.CONTACT_URL+" (adresse à vérifier avant publication).";
if(match(t,['bonjour','salut','hello','bonsoir']))return "Bonjour ! Je peux vous guider dans les couches, les filtres, les thématiques et la préparation d’analyses. Que souhaitez-vous étudier ?";
return "Je peux vous aider sur le Portrait interactif de l’Eau, mais je n’ai pas encore assez d’informations vérifiées pour répondre précisément à cette question. Indiquez le territoire, la thématique et le type de résultat recherché. Pour des analyses complètes en langage naturel, activez le module IA et connectez les couches ArcGIS décrits dans le README.";
}
async function answer(q){say(q,'user');field.value='';send.disabled=true;send.textContent='…';const previous=history.slice(0,-1);try{if(SETTINGS.API_URL){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),22000);let response;try{response=await fetch(SETTINGS.API_URL.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:previous.slice(-10)}),signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw Error('Service indisponible');const data=await response.json();say(data.answer||localAnswer(q))}else{say(localAnswer(q))}}catch(e){say('Le service d’analyse avancée est momentanément indisponible. Voici ce que je peux vous conseiller :\n\n'+localAnswer(q))}finally{send.disabled=false;send.textContent='Envoyer';field.focus()}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=field.value.trim();if(q)answer(q)});document.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.question)));field.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});document.getElementById('reset').addEventListener('click',()=>{history=[];messages.replaceChildren();say('Bonjour ! Je suis l’assistant du Portrait interactif de l’Eau. Posez-moi une question sur les couches, les filtres ou les analyses du territoire.')});say('Bonjour ! Je suis l’assistant du Portrait interactif de l’Eau. Je peux vous guider pour trouver les couches et filtres, comprendre les rubriques et préparer une analyse territoriale. Comment puis-je vous aider ?');
</script></body></html>
