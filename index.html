<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assistant — Portrait interactif de l’Eau</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#23343d;background:#eef1f3}*{box-sizing:border-box}body{margin:0;padding:0}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:100%;max-width:470px;height:100dvh;min-height:390px;max-height:850px;margin:auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 8px 28px #1d343c22}.head{background:#213943;color:white;display:flex;gap:12px;align-items:center;padding:14px 16px;flex-shrink:0}.drop{background:#f0e222;color:#23343d;padding:9px;border-radius:10px;font-size:20px}.head strong{font-size:14px;display:block}.head small{font-size:11px;color:#cfe1e4}.head .reset{margin-left:auto;background:none;color:#e7eeee;border:1px solid #6c848b;padding:6px 9px;border-radius:7px;font-size:12px}.messages{flex:1;overflow-y:auto;padding:18px 15px;background:#f4f7f8;display:flex;flex-direction:column;gap:12px}.msg{max-width:93%;padding:12px 13px;border-radius:13px;font-size:13px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:white;border:1px solid #dce5e9;border-top-left-radius:3px}.user{align-self:flex-end;background:#f0e222;color:#1e2c34;border-top-right-radius:3px}.msg a{color:#145e87}.label{font-size:11px;color:#61727b}.quick{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #e8ecee;max-height:108px;overflow:auto}.quick button{border:1px solid #cddce2;border-radius:17px;background:white;color:#244050;padding:7px 10px;font-size:11px}.quick button:hover{background:#f5f0c5}.entry{display:flex;gap:7px;padding:10px;border-top:1px solid #e4eaed}.entry textarea{flex:1;resize:none;min-height:43px;max-height:100px;padding:10px;border:1px solid #ccd7da;border-radius:9px;font-size:13px}.entry button{border:0;background:#f0e222;border-radius:9px;padding:0 13px;font-weight:bold;color:#1b262b}.busy{opacity:.7}a{color:#0b5f89}@media(min-width:600px){body{padding:8px}.shell{border-radius:13px;overflow:hidden;height:calc(100dvh - 16px)}}
</style></head><body><main class="shell" aria-label="Assistant du Portrait de l'Eau"><header class="head"><span class="drop" aria-hidden="true">💧</span><div><strong>Assistant du Portrait de l’Eau</strong><small>Aide à l’utilisation du portrait</small></div><button class="reset" id="reset" type="button">Effacer</button></header><section id="messages" class="messages" aria-live="polite"></section><nav class="quick" aria-label="Questions proposées"><button data-question="Où trouver les couches et la légende ?">Couches & légende</button><button data-question="Comment sélectionner un SAGE, une intercommunalité ou un bassin versant ?">Filtres</button><button data-question="Comment utiliser les outils de la carte ?">Outils de la carte</button><button data-question="Comment contacter l'Agence ?">Contacter l’Agence</button></nav><form id="form" class="entry"><textarea id="question" rows="2" maxlength="2000" placeholder="Posez votre question sur le portrait…" aria-label="Votre question" required></textarea><button id="send" type="submit">Envoyer</button></form></main><script>
const CONTACT_URL = 'https://www.aud-stomer.fr/contact/';
const messages = document.getElementById('messages');
const field = document.getElementById('question');
const form = document.getElementById('form');

function say(text, who = 'bot') {
  const element = document.createElement('div');
  element.className = 'msg ' + who;
  element.textContent = text;
  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}
function normalize(value) {
  return value.toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[’']/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function includesAny(text, words) { return words.some(word => text.includes(word)); }
function respond(question) {
  const t = normalize(question);
  const agency = 'Pour cette demande, je vous invite à contacter l’Agence en cliquant sur « Contactez-nous » en haut à droite du portail : ' + CONTACT_URL;

  // Questions hors assistance à l'utilisation : orientation vers l'Agence.
  if (includesAny(t, [
    'analyse', 'analyser', 'synthese', 'diagnostic', 'rapport', 'etude',
    'statistique', 'chiffre', 'pourcentage', 'superficie', 'calcul',
    'comparer', 'comparaison', 'evolution', 'prevision', 'interpretation',
    'donnees brutes', 'telecharger des donnees', 'export de donnees',
    'prix', 'devis', 'recrutement', 'emploi', 'actualite', 'meteo'
  ])) return agency;

  if (includesAny(t, ['contact', 'technicien', 'probleme', 'bug', 'difficulte', 'ne marche pas', 'erreur', 'assistance', 'bloque', 'panne'])) {
    return 'Pour signaler une difficulté, cliquez sur « Contactez-nous » en haut à droite du portail. Précisez la rubrique utilisée et décrivez le problème. Si possible, ajoutez une capture d’écran.\n' + CONTACT_URL;
  }

  if (includesAny(t, ['bonjour', 'bonsoir', 'salut', 'hello', 'merci'])) {
    return 'Bonjour ! Je vous aide à utiliser le Portrait interactif de l’Eau : rubriques, carte, couches, légende et filtres. Quelle action souhaitez-vous réaliser ?';
  }

  if (includesAny(t, ['sage', 'intercommunal', 'epci', 'bassin versant', 'filtre', 'filtrer', 'selectionner', 'choisir un territoire', 'recherche de territoire'])) {
    return 'Pour sélectionner un territoire :\n1. Ouvrez une rubrique cartographique dans le menu supérieur.\n2. Dans la colonne de gauche, choisissez « Filtrer par SAGE », « Filtrer par intercommunalités » ou « Filtre par bassin versant ».\n3. Utilisez « Recherche… » ou sélectionnez un territoire dans la liste.\n4. Consultez la carte actualisée. Pour modifier votre sélection, retournez dans le filtre.';
  }

  if (includesAny(t, ['legende', 'symbole', 'signification des couleurs', 'couleur de la carte'])) {
    return 'Pour lire la légende :\n1. Ouvrez la rubrique cartographique souhaitée.\n2. Regardez le panneau de droite de la carte, qui affiche les rubriques et les symboles disponibles.\n3. Utilisez les outils de légende ou de couches si ces commandes sont visibles.\n4. Comparez les symboles affichés sur la carte avec la légende. Certaines couches peuvent ne pas fournir de légende.';
  }

  if (includesAny(t, ['couche', 'layer', 'afficher une donnee', 'activer', 'masquer', 'superposer', 'afficher la carte', 'voir sur la carte'])) {
    return 'Pour afficher les couches :\n1. Ouvrez une rubrique depuis le menu en haut.\n2. Repérez l’icône des couches empilées dans les outils de la carte à droite.\n3. Affichez la liste des couches et utilisez les commandes disponibles pour les consulter, les activer ou les masquer.\n4. Regardez le panneau de légende à droite pour comprendre les symboles.\n5. Cliquez sur un objet cartographique si une fenêtre d’information est proposée.';
  }

  if (includesAny(t, ['zoom', 'dezoomer', 'dezoome', 'deplacer la carte', 'se deplacer', 'outil', 'naviguer', 'navigation', 'plein ecran', 'recentrer', 'chercher sur la carte'])) {
    return 'Pour utiliser la carte :\n1. Ouvrez l’onglet souhaité dans le menu supérieur.\n2. Déplacez la carte avec la souris ou le geste tactile.\n3. Zoomez et dézoomez avec la molette ou les commandes disponibles.\n4. Sur la droite, ouvrez les outils de recherche, de couches ou d’affichage proposés.\n5. Si besoin, affinez le territoire à l’aide des filtres à gauche.';
  }

  if (includesAny(t, ['inondation', 'risque lie a l eau', 'risques lies a l eau', 'crue', 'alea'])) {
    return 'Pour accéder à la rubrique concernée :\n1. Cliquez sur « Risques liés à l’eau » dans le menu supérieur.\n2. Choisissez un territoire dans les filtres de gauche si nécessaire.\n3. Consultez les couches et la légende affichées sur la carte.\n4. Zoomez ou cliquez sur un élément pour obtenir les informations disponibles.';
  }

  if (includesAny(t, ['biodiversite', 'zone humide', 'milieu humide', 'milieux aquatiques'])) {
    return 'Pour trouver cette rubrique :\n1. Cliquez sur « Biodiversité & milieux humides/aquatiques » en haut du portrait.\n2. Consultez les couches et les symboles disponibles sur la carte.\n3. Utilisez les filtres de territoire et le panneau de légende si présents.';
  }

  if (includesAny(t, ['petit cycle', 'usage de l eau', 'usages de l eau', 'patrimoine lie', 'patrimoine de l eau', 'accueil', 'rubrique', 'onglet', 'menu', 'page du portrait'])) {
    return 'Pour vous rendre dans une rubrique, utilisez le menu horizontal en haut du portail : Accueil, Risques liés à l’eau, Biodiversité & milieux humides/aquatiques, Petit cycle de l’eau, Usages de l’Eau ou Patrimoine lié à l’eau. Certaines rubriques peuvent être en cours de construction. Si une fonctionnalité attendue est absente, contactez l’Agence.';
  }

  if (includesAny(t, ['cours d eau', 'riviere', 'reseau hydrographique', 'hydrographie'])) {
    return 'Pour consulter les cours d’eau sur la carte :\n1. Ouvrez la rubrique cartographique concernée.\n2. Regardez le panneau de droite « Périmètres & Habillage », puis « Réseau hydrographique » ou « Cours d’eau », si ces éléments sont affichés.\n3. Utilisez les outils de couches et zoomez sur la zone souhaitée.';
  }

  // Toute autre demande est adressée à un interlocuteur de l'Agence.
  return agency;
}
function answer(question) {
  const q = question.trim();
  if (!q) return;
  say(q, 'user');
  field.value = '';
  say(respond(q));
  field.focus();
}
form.addEventListener('submit', event => {
  event.preventDefault();
  answer(field.value);
});
document.querySelectorAll('[data-question]').forEach(button => {
  button.addEventListener('click', () => answer(button.dataset.question));
});
field.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
document.getElementById('reset').addEventListener('click', () => {
  messages.replaceChildren();
  say('Bonjour ! Je suis l’assistant du Portrait interactif de l’Eau. Je vous aide à trouver les rubriques, les couches, les légendes et les filtres. Comment puis-je vous guider ?');
});
say('Bonjour ! Je suis l’assistant du Portrait interactif de l’Eau. Je peux vous guider dans l’utilisation du portail : menus, cartes, couches, légendes et filtres. Comment puis-je vous aider ?');
</script></body></html>
